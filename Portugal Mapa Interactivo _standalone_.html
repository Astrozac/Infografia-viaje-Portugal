ública que asciende hasta la cubierta-mirador sobre el mar.\"},\n  {id:3,code:\"03\",name:\"Casa da Cultura de Pinhel\",city:\"Pinhel\",year:2016,architect:\"depA architects\",award:\"APOM 2016\",lat:40.7730499,lng:-7.0621755,address:\"Largo Combatentes Grande Guerra, 6400-311 Pinhel\",imgUrl:\"https://www.archdaily.com.br/br/761023/casa-da-cultura-de-pinhel-depa\",icon:\"pinhel\",desc:\"Rehabilitación del Palacio Episcopal del s. XVIII en centro cultural municipal. La intervención retira capas espurias y reintroduce una caja de cristal espejado en el patio que aloja la taquilla, dialogando con la mampostería de granito. La madera demolida se reutilizó para el mobiliario.\"},\n  {id:4,code:\"04\",name:\"Centro de Convívio de Grândola\",city:\"Grândola\",year:2016,architect:\"Aires Mateus\",award:\"Arquitectura Viva · Divisare\",lat:38.1736652,lng:-8.5661894,address:\"7570-239 Grândola, Alentejo\",imgUrl:\"https://www.archdaily.com/874843/grandola-meeting-center-aires-mateus\",icon:\"grandola\",desc:\"Monolito blanco con vacíos esculpidos en cada fachada que enmarcan accesos y dejan entrar la luz. Centro cívico de día para mayores: una sola gran sala cuadrada reconfigurable con tabiques móviles y lucernarios cónicos. Síntesis radical de la lección del muro blanco alentejano.\"},\n  {id:5,code:\"05\",name:\"Museu Abade Pedrosa / MIEC\",city:\"Santo Tirso\",year:2016,architect:\"Siza + Souto de Moura\",award:\"Mies 2017 nominee\",lat:41.3444231,lng:-8.4722356,address:\"4780-368 Santo Tirso\",imgUrl:\"https://divisare.com/projects/318376-alvaro-siza-vieira-eduardo-souto-de-moura-joao-morgado-abade-pedrosa-museum\",icon:\"abade\",desc:\"Reorganización del antiguo monasterio benedictino y construcción de un nuevo volumen blanco bajo para el Museo Internacional de Escultura Contemporánea. Una rara colaboración entre los dos Pritzker portugueses.\"},\n  {id:6,code:\"06\",name:\"Casa da Arquitectura — Real Vinícola\",city:\"Matosinhos\",year:2017,architect:\"Guilherme Machado Vaz\",award:\"Prémio Nacional Reabilitação Urbana 2018\",lat:41.1785296,lng:-8.6868448,address:\"Av. Menéres 456, 4450-189 Matosinhos\",imgUrl:\"https://www.archdaily.com/884697/real-vinicola-nil-casa-da-arquitectura-guilherme-machado-vaz\",icon:\"realvinicola\",desc:\"Rehabilitación de las antiguas naves vinícolas (1897–1901) como sede del Centro Português de Arquitectura. Conserva el espíritu industrial y suma escaleras exteriores de hormigón armado, además de patios que respetan los árboles del abandono. Alberga el archivo más importante de arquitectura portuguesa.\"},\n  {id:7,code:\"07\",name:\"Terminal de Cruzeiros de Lisboa\",city:\"Lisboa\",year:2017,architect:\"João Luís Carrilho da Graça\",award:\"Prémio Valmor 2017\",lat:38.7104027,lng:-9.1262866,address:\"Doca Jardim do Tabaco, 1100-651 Lisboa\",imgUrl:\"https://www.archdaily.com/889236/lisbon-cruise-terminal-carrilho-da-graca-arquitectos\",icon:\"cruise\",desc:\"Volumen compacto de dos plantas conectado al ferrocarril elevado por dos pasarelas. Su escala y tono blanco roto resuenan con el perfil del Alfama medieval. Respeta las vistas sobre el castillo de São Jorge y devuelve el frente fluvial al uso público.\"},\n  {id:8,code:\"08\",name:\"Galeria da Biodiversidade — Casa Andresen\",city:\"Porto\",year:2017,architect:\"Nuno Valentim\",award:\"Mies 2019 nominee · IAA 2019\",lat:41.1537329,lng:-8.6425638,address:\"Rua do Campo Alegre 1191, 4150-181 Porto\",imgUrl:\"https://noticias.up.pt/jardim-botanico-do-porto-nomeado-para-premio-de-arquitetura-mies-van-der-rohe/\",icon:\"andresen\",desc:\"Rehabilitación de la casa donde vivieron Sophia de Mello Breyner Andresen y Ruben A., convertida en el primer Centro Ciência Viva dedicado a la biodiversidad. Museografía de Jorge Wagensberg. La suspensión del esqueleto de ballena es referencia directa a un cuento de Sophia.\"},\n  {id:9,code:\"09\",name:\"Pavilhão do Lago · Serralves\",city:\"Porto\",year:2018,architect:\"depA architects\",award:\"FAD 2018 · Bienal Venecia 2018\",lat:41.1590347,lng:-8.6581114,address:\"R. Dom João de Castro 210, 4150-417 Porto\",imgUrl:\"https://www.yellowtrace.com.au/liquid-pavilion-depa-serralves-museum-portugal/\",icon:\"lago\",desc:\"Pabellón circular de chapa metálica espejada construido sobre el lago del parque de Siza, como extensión temporal del Museo de Serralves. El cilindro reflectante desaparece visualmente en el agua y la vegetación.\"},\n  {id:10,code:\"10\",name:\"Centro Interpretativo do Vale do Tua\",city:\"Carrazeda de Ansiães\",year:2018,architect:\"Rosmaninho+Azevedo\",award:\"Archizinc 2018 · Mies 2019 nominee\",lat:41.207314,lng:-7.419372,address:\"Estação Ferroviária, 5140-133 Castanheiro\",imgUrl:\"https://www.archdaily.com/908855/vale-do-tua-interpretive-center-rosmaninho-plus-azevedo-arquitectos\",icon:\"tua\",desc:\"Reuso de dos antiguos almacenes ferroviarios sumergidos al construirse la presa del Tua, en pleno territorio UNESCO del Alto Douro. Uno conserva la envolvente original de madera centenaria; el otro se reviste de zinc corrugado nuevo.\"},\n  {id:11,code:\"11\",name:\"Casa do Cinema Manoel de Oliveira\",city:\"Porto\",year:2019,architect:\"Álvaro Siza Vieira\",award:\"Fundação Serralves\",lat:41.1590226,lng:-8.655228,address:\"R. de Serralves 873, 4150 Porto\",imgUrl:\"https://www.serralves.pt/en/institucional-serralves/casa-do-cinema-arquitetura/\",icon:\"cinema\",desc:\"Adaptación de la antigua garage de la Casa de Serralves (Marques da Silva, 1925) como archivo, sala de cine, espacio expositivo y centro de documentación dedicado al cineasta más longevo de la historia.\"},\n  {id:12,code:\"12\",name:\"Casa do Conhecimento\",city:\"Vila Verde\",year:2019,architect:\"Eduardo Souto de Moura\",award:\"Arquitectura Viva · ArchDaily\",lat:41.6525947,lng:-8.435208,address:\"Praça 5 de Outubro 55, 4730-731 Vila Verde\",imgUrl:\"https://arquitecturaviva.com/obras/casa-do-conhecimento\",icon:\"conhecimento\",desc:\"Equipamiento municipal para acceso público a las nuevas tecnologías, talleres y exposiciones. Su fachada continua de vidrio hace visible la actividad interior desde la calle, invirtiendo la lógica habitual del edificio público opaco.\"},\n  {id:13,code:\"13\",name:\"Terminal Intermodal de Campanhã (TIC)\",city:\"Porto\",year:2021,architect:\"Nuno Brandão Costa\",award:\"AICA 2021 · Architectural Record 2024\",lat:41.1527059,lng:-8.5828277,address:\"R. de Bonjóia 691, 4300-084 Porto\",imgUrl:\"https://www.archdaily.com/981889/tic-terminal-intermodal-de-campanha-nuno-brandao-costa\",icon:\"campanha\",desc:\"Infraestructura lineal de 600 metros que organiza tres niveles: paseo elevado superior sin programa, arcada intermedia y zona de buses bajo cubierta verde. Architectural Record lo definió como ejemplo de architettura povera heredera de las primeras obras de Siza.\"},\n  {id:14,code:\"14\",name:\"Reabilitação do Mercado do Bolhão\",city:\"Porto\",year:2022,architect:\"Nuno Valentim\",award:\"Mies 2024 nominee · ULI Europe 2023\",lat:41.1493855,lng:-8.6071175,address:\"R. Formosa 322, 4000-248 Porto\",imgUrl:\"https://www.archdaily.com/989540/mercado-do-bolhao-rehabilitation-nuno-valentim-arquitectura\",icon:\"bolhao\",desc:\"Restauración del mercado Beaux-Arts (1914–17) de António Correia da Silva, manteniéndolo como mercado de productos frescos. Acción explícitamente anti-gentrificación: preserva a los vendedores históricos.\"},\n  {id:15,code:\"15\",name:\"Estufas Tropicais · Jardim Botânico UC\",city:\"Coimbra\",year:2022,architect:\"João Mendes Ribeiro\",award:\"FAD 2022 finalist\",lat:40.2057483,lng:-8.4220282,address:\"Jardim Botânico, 3000 Coimbra\",imgUrl:\"https://www.archdaily.com/982767/tropical-greenhouses-of-university-of-coimbras-botanical-garden-joao-mendes-ribeiro\",icon:\"estufas\",desc:\"Reconstrucción de las estufas históricas en el jardín UNESCO de Coimbra. Estructura ligera de acero y vidrio que dialoga con la trama Pombalina del jardín del s. XVIII.\"},\n  {id:16,code:\"16\",name:\"Câmara Municipal da Trofa\",city:\"Trofa\",year:2022,architect:\"NOARQ\",award:\"e-architect 2024\",lat:41.3337354,lng:-8.5590445,address:\"Praça do Município 480, 4785-205 Trofa\",imgUrl:\"https://www.archdaily.com/995073/trofa-town-hall-noarq\",icon:\"trofa\",desc:\"El primer ayuntamiento de la historia para Trofa, municipio que solo logró autonomía administrativa en 1998. Cuerpo oscuro con interiores luminosos en torno a un patio. Pieza pivotal para la consolidación urbana de la ciudad.\"},\n  {id:17,code:\"17\",name:\"Praça e Posto de Turismo de Piódão\",city:\"Arganil · Piódão\",year:2022,architect:\"Branco del Rio\",award:\"Mies 2024 Emerging finalist\",lat:40.2292601,lng:-7.8250288,address:\"6285 Piódão, Arganil\",imgUrl:\"https://arquitecturaviva.com/works/plaza-y-oficina-de-turismo-piodao\",icon:\"piodao\",desc:\"Reconfiguración de la plaza y oficina de turismo en una aldea de pizarra protegida. Intervención mínima donde apenas se distingue lo nuevo de lo viejo, planteando una ética rural contemporánea de sustentabilidad cultural.\"},\n  {id:18,code:\"18\",name:\"Quinta do Mitra\",city:\"Porto\",year:2022,architect:\"Brandão Costa Arquitectos\",award:\"Designboom · Archello\",lat:41.1545214,lng:-8.5832003,address:\"R. Dr. Maurício E. P. Pinto 403, 4300-527 Porto\",imgUrl:\"https://www.designboom.com/architecture/brandao-costa-quinta-do-mitra-renovation-porto-portugal-07-25-2024/\",icon:\"mitra\",desc:\"Rehabilitación de una quinta rural del s. XIX que quedó cercada por infraestructuras (ferrocarril, VCI, terminal). Brandão Costa interviene con añadidos ligeros de madera y metal que contrastan con la mampostería original.\"},\n  {id:19,code:\"19\",name:\"Centro Comunitário Fonte da Prata\",city:\"Alhos Vedros · Moita\",year:2023,architect:\"PROMONTORIO\",award:\"ArchDaily 2023\",lat:38.6580036,lng:-9.0076031,address:\"Alhos Vedros, Moita\",imgUrl:\"https://www.archdaily.com/1007385/fonte-da-prata-community-center-promontorio\",icon:\"fonteprata\",desc:\"Pequeño equipamiento social en zona rural. Volumetría sobria que actualiza la tipología vernácula del centro comunitario con materiales y geometría contemporáneos.\"},\n  {id:20,code:\"20\",name:\"Jardim da Galeria Municipal do Montijo\",city:\"Montijo\",year:2024,architect:\"Bak Gordon + RM Arquitectura\",award:\"AICA 2019 · FORMA 2022\",lat:38.7056403,lng:-8.974007,address:\"R. Alm. Cândido dos Reis 12, 2870-471 Montijo\",imgUrl:\"https://www.archdaily.com/1018257/jardim-da-galeria-municipal-do-montijo-bak-gordon-arquitectos-plus-rm-arquitectura\",icon:\"montijo\",desc:\"Pequeña obra pública que resuelve la accesibilidad a la Galería Municipal mediante un ascensor introducido en un edificio del s. XIX y un jardín que articula el conjunto en pleno centro de la ciudad.\"}\n];\n\nconst ACTIVITIES = [\n  {id:\"A\",code:\"A\",name:\"Piscinas das Marés\",city:\"Leça da Palmeira\",category:\"Arquitectura habitada\",lat:41.1927721,lng:-8.7077034,address:\"Av. Liberdade, 4450-790 Leça da Palmeira\",imgUrl:\"https://www.archdaily.com/150272/ad-classics-leca-swimming-pools-alvaro-siza\",icon:\"pools\",desc:\"Obra inicial de Siza (1961–66), Patrimonio Nacional desde 2011. Caminarla en uso —pisando los muros bajos, viendo cómo los peatones suben y bajan al nivel del océano— es entender el método Porto: arquitectura como continuación del relieve.\"},\n  {id:\"B\",code:\"B\",name:\"Fado tradicional · Tasca do Chico\",city:\"Lisboa · Bairro Alto\",category:\"Música · UNESCO inmaterial\",lat:38.7116247,lng:-9.1441396,address:\"R. do Diário de Notícias 39, 1200-141 Lisboa\",icon:\"fado\",desc:\"El fado está en la lista UNESCO de Patrimonio Cultural Inmaterial. Escucharlo en interiores originales —tabernas pequeñas, capelas estudiantiles— explica una parte sustancial de la espacialidad doméstica portuguesa: penumbra, intimidad, suelo de madera, paredes irregulares.\"},\n  {id:\"C\",code:\"C\",name:\"Baixa Pombalina\",city:\"Lisboa\",category:\"Urbanismo iluminista\",lat:38.7072828,lng:-9.1363613,address:\"Praça do Comércio, 1100-148 Lisboa\",icon:\"pombalina\",desc:\"Tras el terremoto de 1755, Manuel da Maia, Carlos Mardel y Eugénio dos Santos trazan en cinco años un plan ortogonal con edificios anti-sísmicos prefabricados (gaiola pombalina). Primer ensayo europeo de ciudad como infraestructura modular y replicable.\"},\n  {id:\"D\",code:\"D\",name:\"Eléctrico 28\",city:\"Lisboa\",category:\"Sección urbana en movimiento\",lat:38.7152423,lng:-9.1360784,address:\"Praça Martim Moniz 577, 1100-341 Lisboa\",icon:\"tram\",desc:\"Sección urbana en movimiento. Atraviesa el casco antiguo entero (Graça → Alfama → Baixa → Chiado → Estrela → Campo de Ourique), marca cambios de cota imposibles para el peatón y revela la lógica de las siete colinas. Ir temprano (8 h) o tarde (21 h) para evitar masa.\"},\n  {id:\"E\",code:\"E\",name:\"Museu Nacional do Azulejo\",city:\"Lisboa\",category:\"Arte decorativa · azulejo\",lat:38.7250559,lng:-9.113539,address:\"R. Madre de Deus 4, 1900-312 Lisboa\",icon:\"azulejo\",desc:\"El azulejo es la técnica decorativa que estructura una porción enorme de la imagen pública portuguesa. La Capela de Santo António Pequenino (s. XVIII) y el mural panorámico de Lisboa pre-terremoto dan una clave de lectura para entender cómo la pared en Portugal nunca es solo soporte.\"},\n  {id:\"F\",code:\"F\",name:\"Estação de São Bento · azulejos Colaço\",city:\"Porto\",category:\"Arte decorativa · azulejo\",lat:41.145492,lng:-8.609544,address:\"Praça de Almeida Garrett, 4000-069 Porto\",icon:\"saobento\",desc:\"20.000 azulejos de Jorge Colaço (1905–1916) que narran la historia portuguesa desde la época romana hasta los descubrimientos. Complemento necesario al Museu do Azulejo: la técnica aplicada al programa público civil del s. XX.\"},\n  {id:\"G\",code:\"G\",name:\"Valle del Douro · Quinta do Bomfim\",city:\"Pinhão\",category:\"Paisaje cultural UNESCO\",lat:41.1891952,lng:-7.540864,address:\"Largo do Videira, 5085-060 Pinhão\",icon:\"douro\",desc:\"Paisaje cultural UNESCO desde 2001. Los socalcos (terrazas) son la mayor obra colectiva de modificación del territorio portugués. Cada quinta es una unidad arquitectónica-productiva-paisajística que sostuvo la economía rural durante siglos.\"},\n  {id:\"H\",code:\"H\",name:\"Biblioteca Joanina + Universidade de Coimbra\",city:\"Coimbra\",category:\"Patrimonio universitario UNESCO\",lat:40.2071974,lng:-8.426338,address:\"Biblioteca Joanina, 3000-233 Coimbra\",icon:\"joanina\",desc:\"Una de las universidades más antiguas de Europa (1290). La Biblioteca Joanina (1717–28, barroco joanino) es la pieza más extraordinaria, con su sistema de murciélagos para control biológico de plagas. Pareja conceptual del Mosteiro dos Jerónimos para entender el Portugal letrado.\"},\n  {id:\"I\",code:\"I\",name:\"Ribeira do Porto + Festas de São João\",city:\"Porto\",category:\"Espacio público · festa popular\",lat:41.1404099,lng:-8.6125664,address:\"Cais da Ribeira 47, 4050-511 Porto\",icon:\"ribeira\",desc:\"Patrimonio UNESCO. Frente fluvial denso del medievo portuario portugués. Las festas dos Santos Populares (São João, 23–24 junio) son la apropiación radical del espacio público portuguesa: pulpo asado en la calle, manjericos con cuartetas, martillos de plástico, sardinas en cada portal.\"},\n  {id:\"J\",code:\"J\",name:\"Cervejaria Ramiro · mariscos y bacalhau\",city:\"Lisboa\",category:\"Cocina atlántica\",lat:38.720257,lng:-9.1357429,address:\"Av. Alm. Reis 1H, 1150-007 Lisboa\",icon:\"ramiro\",desc:\"El bacalhau —pescado del Atlántico Norte que Portugal nunca tuvo en sus costas— condensa cinco siglos de historia colonial, comercial y técnica. Que la cocina portuguesa más esencial dependa de un proceso de conservación y rehidratación, no de un producto local, explica algo sobre la geografía mental del país.\"},\n  {id:\"K\",code:\"K\",name:\"A Brasileira do Chiado\",city:\"Lisboa\",category:\"Café modernista · bica\",lat:38.7107003,lng:-9.1420317,address:\"R. Garrett 120-122, 1200-205 Lisboa\",icon:\"brasileira\",desc:\"El café portugués corto y oscuro (bica en Lisboa, cimbalino en Porto) está intrínsecamente ligado a una cultura urbana de pensamiento. A Brasileira fue lugar de Pessoa, Almada Negreiros y los modernistas de Orpheu. El laboratorio de la modernidad portuguesa.\"},\n  {id:\"L\",code:\"L\",name:\"Pastéis de Belém (1837)\",city:\"Lisboa · Belém\",category:\"Gastronomía manuelina\",lat:38.6975105,lng:-9.2032276,address:\"R. de Belém 84-92, 1300-085 Lisboa\",icon:\"pasteis\",desc:\"Receta secreta desde 1837, heredada del Mosteiro dos Jerónimos. La cola y la espera son parte del ritual. Acompañar con la visita al monasterio manuelino frente a la rua. La versión gastronómica de la herencia manuelina: lo barroco como detalle, lo local como universal.\"}\n];\n\n/* ────────── ICONS — geometría elemental, ahora dibujada en negro\n   sobre los tiles RGB para máximo contraste tipo BIG ────────── */\nconst ICONS = {\n  edp: '<line x1=\"-6\" y1=\"-9\" x2=\"-6\" y2=\"9\" class=\"glyph\"/><line x1=\"6\" y1=\"-9\" x2=\"6\" y2=\"9\" class=\"glyph\"/><line x1=\"-6\" y1=\"0\" x2=\"6\" y2=\"0\" class=\"glyph\"/>',\n  costanova: '<line x1=\"-10\" y1=\"-6\" x2=\"10\" y2=\"-6\" class=\"glyph\"/><line x1=\"-10\" y1=\"0\" x2=\"10\" y2=\"0\" class=\"glyph\"/><line x1=\"-10\" y1=\"6\" x2=\"10\" y2=\"6\" class=\"glyph\"/>',\n  pinhel: '<rect x=\"-10\" y=\"-10\" width=\"20\" height=\"20\" class=\"glyph\"/><rect x=\"-4\" y=\"-4\" width=\"8\" height=\"8\" class=\"glyph\"/>',\n  grandola: '<path d=\"M -10 -10 L 10 -10 L 10 10 L -10 10 Z\" class=\"glyph\"/><path d=\"M -10 -3 L -5 -3 L -5 3 L -10 3\" class=\"glyph\"/><path d=\"M 10 -3 L 5 -3 L 5 3 L 10 3\" class=\"glyph\"/>',\n  abade: '<rect x=\"-11\" y=\"-8\" width=\"13\" height=\"13\" class=\"glyph\"/><rect x=\"2\" y=\"1\" width=\"9\" height=\"4\" class=\"glyph\"/>',\n  realvinicola: '<path d=\"M -11 6 L -7 -4 L -3 6 L 1 -4 L 5 6 L 9 -4\" class=\"glyph\"/><line x1=\"-11\" y1=\"6\" x2=\"11\" y2=\"6\" class=\"glyph\ :-7.430, anchor:\"start\", dx:8, dy:3, tier:1},\n  {name:\"Lisboa\",           lat:38.736, lng:-9.142, anchor:\"end\", dx:-8, dy:3, tier:0},\n  {name:\"Setúbal\",          lat:38.524, lng:-8.893, anchor:\"end\", dx:-8, dy:8, tier:1},\n  {name:\"Évora\",            lat:38.572, lng:-7.910, anchor:\"start\", dx:8, dy:3, tier:0},\n  {name:\"Beja\",             lat:38.015, lng:-7.863, anchor:\"start\", dx:8, dy:3, tier:1},\n  {name:\"Faro\",             lat:37.019, lng:-7.930, anchor:\"start\", dx:8, dy:3, tier:0}\n];\n\n/* ============================================================\n   CATMULL-ROM SMOOTHED PATH\n============================================================ */\nfunction smoothPath(latlngs, closed=false){\n  const pts = latlngs.map(([la,ln])=>project(la,ln));\n  if(closed) pts.push(pts[0]);\n  let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;\n  const n = pts.length;\n  for(let i=0;i<n-1;i++){\n    const p0 = pts[i-1] ?? pts[closed?n-2:0];\n    const p1 = pts[i];\n    const p2 = pts[i+1];\n    const p3 = pts[i+2] ?? pts[closed?1:n-1];\n    const t = 0.42;\n    const cp1x = p1.x + (p2.x - p0.x) * t/3;\n    const cp1y = p1.y + (p2.y - p0.y) * t/3;\n    const cp2x = p2.x - (p3.x - p1.x) * t/3;\n    const cp2y = p2.y - (p3.y - p1.y) * t/3;\n    d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)} ${cp2x.toFixed(2)} ${cp2y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;\n  }\n  if(closed) d += ' Z';\n  return d;\n}\nfunction linePath(latlngs){\n  return latlngs.map(([la,ln],i)=>{\n    const p = project(la,ln);\n    return (i===0?'M ':'L ')+p.x.toFixed(1)+' '+p.y.toFixed(1);\n  }).join(' ');\n}\n\n/* ============================================================\n   RENDER MAP\n============================================================ */\ndocument.getElementById('land-path').setAttribute('d', smoothPath(COAST, true));\ndocument.getElementById('river-douro').setAttribute('d', smoothPath(RIVER_DOURO, false));\ndocument.getElementById('river-tejo').setAttribute('d', smoothPath(RIVER_TEJO, false));\ndocument.getElementById('river-guadiana').setAttribute('d', smoothPath(RIVER_GUADIANA, false));\n\n// District dividers (linear, dashed)\nconst gDLines = document.getElementById('district-lines');\nDISTRICTS.forEach(seg=>{\n  const path = document.createElementNS('http://www.w3.org/2000/svg','path');\n  path.setAttribute('class','district-line');\n  path.setAttribute('d', smoothPath(seg, false));\n  gDLines.appendChild(path);\n});\n\n// Cities — district capitals\nconst gCities = document.getElementById('cities');\nCITIES.forEach(c=>{\n  const p = project(c.lat,c.lng);\n  const g = document.createElementNS('http://www.w3.org/2000/svg','g');\n  const isPrimary = c.tier === 0;\n  g.innerHTML = `\n    ${isPrimary\n      ? `<rect x=\"${p.x-3}\" y=\"${p.y-3}\" width=\"6\" height=\"6\" fill=\"var(--ink-2)\"/>`\n      : `<rect x=\"${p.x-1.5}\" y=\"${p.y-1.5}\" width=\"3\" height=\"3\" fill=\"var(--ink-2)\"/>`}\n    <text class=\"city-label ${isPrimary?'':'small'}\"\n          x=\"${p.x+c.dx}\" y=\"${p.y+c.dy}\" text-anchor=\"${c.anchor}\">${c.name.toUpperCase()}<\u002Ftext>\n  `;\n  gCities.appendChild(g);\n});\n\n/* ============================================================\n   MARKERS — pixel tiles\n============================================================ */\nconst gMarkers = document.getElementById('markers');\nconst SIZE_BASE = 18;     // tile size (px in SVG units)\n\nfunction renderMarker(item, type){\n  const p = project(item.lat,item.lng);\n  const g = document.createElementNS('http://www.w3.org/2000/svg','g');\n  g.setAttribute('class', `marker ${type}`);\n  g.setAttribute('transform', `translate(${p.x},${p.y})`);\n  g.setAttribute('data-id', `${type}-${item.id}`);\n\n  const tileX = -SIZE_BASE/2;\n  const tileY = -SIZE_BASE/2;\n\n  // Label box (auto width)\n  const labelTxt = item.code + ' · ' + item.name.toUpperCase();\n  const labelW = Math.min(labelTxt.length*5.6, 240);\n\n  g.innerHTML = `\n    <rect class=\"hit\" x=\"${-22}\" y=\"${-22}\" width=\"44\" height=\"44\"><\u002Frect>\n    <rect class=\"tile\" x=\"${tileX}\" y=\"${tileY}\" width=\"${SIZE_BASE}\" height=\"${SIZE_BASE}\"><\u002Frect>\n    <g transform=\"scale(0.7)\">${ICONS[item.icon]||''}<\u002Fg>\n    <text class=\"code\" y=\"22\">${item.code}<\u002Ftext>\n    <g class=\"name\" transform=\"translate(0,${SIZE_BASE/2 + 12})\">\n      <rect class=\"name-bg\" x=\"${-labelW/2}\" y=\"-1\" width=\"${labelW}\" height=\"16\"><\u002Frect>\n      <text class=\"name-tx\" x=\"0\" y=\"10\" text-anchor=\"middle\">${labelTxt}<\u002Ftext>\n    <\u002Fg>\n  `;\n\n  g.addEventListener('click', ()=>selectItem(item, type));\n  gMarkers.appendChild(g);\n}\nPROJECTS.forEach(p=>renderMarker(p,'arch'));\nACTIVITIES.forEach(a=>renderMarker(a,'cult'));\n\n/* ============================================================\n   DIRECTORY (index in panel)\n============================================================ */\nfunction renderDirectory(items, type, mountId){\n  const mount = document.getElementById(mountId);\n  items.forEach(it=>{\n    const row = document.createElement('div');\n    row.className = `dir-row ${type}`;\n    row.setAttribute('data-id', `${type}-${it.id}`);\n    const sub = type==='arch'\n      ? `${it.architect} · ${it.city}`\n      : `${it.category} · ${it.city}`;\n    const yr = type==='arch' ? it.year : '—';\n    row.innerHTML = `\n      <div class=\"code\"><span class=\"sq\"><\u002Fspan>${it.code}<\u002Fdiv>\n      <div class=\"meta\">\n        <div class=\"nm\">${it.name}<\u002Fdiv>\n        <div class=\"sub\">${sub}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"yr\">${yr}<\u002Fdiv>\n    `;\n    row.addEventListener('click', ()=>selectItem(it, type));\n    mount.appendChild(row);\n  });\n}\nrenderDirectory(PROJECTS, 'arch', 'dir-arch');\nrenderDirectory(ACTIVITIES, 'cult', 'dir-cult');\n\n/* ============================================================\n   FILTERS\n============================================================ */\ndocument.querySelectorAll('.btn').forEach(b=>{\n  b.addEventListener('click', ()=>{\n    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));\n    b.classList.add('active');\n    const f = b.dataset.filter;\n    document.querySelectorAll('.marker').forEach(m=>{\n      const t = m.classList.contains('cult') ? 'cult' : 'arch';\n      m.classList.toggle('dim', f!=='all' && f!==t);\n    });\n    document.querySelectorAll('.dir-row').forEach(r=>{\n      const t = r.classList.contains('cult') ? 'cult' : 'arch';\n      r.style.display = (f==='all' || f===t) ? '' : 'none';\n    });\n    document.querySelectorAll('.dir-section').forEach(s=>{\n      const cards = s.querySelectorAll('.dir-row');\n      const anyVisible = Array.from(cards).some(c => c.style.display !== 'none');\n      s.style.display = anyVisible ? '' : 'none';\n    });\n  });\n});\n\n/* ============================================================\n   SELECTION + DETAIL\n============================================================ */\nconst directoryEl = document.getElementById('directory');\nconst detailEl = document.getElementById('detail');\ndocument.getElementById('d-back').addEventListener('click', deselect);\n\nfunction deselect(){\n  document.querySelectorAll('.marker.active').forEach(m=>m.classList.remove('active'));\n  detailEl.classList.remove('show');\n  directoryEl.style.display = '';\n  document.getElementById('panel-body').scrollTop = 0;\n}\n\nfunction selectItem(item, type){\n  document.querySelectorAll('.marker.active').forEach(m=>m.classList.remove('active'));\n  const node = document.querySelector(`.marker[data-id=\"${type}-${item.id}\"]`);\n  if(node) node.classList.add('active');\n\n  directoryEl.style.display = 'none';\n  detailEl.classList.add('show');\n\n  const isArch = type==='arch';\n\n  // Badge & code\n  const badge = document.getElementById('d-badge');\n  badge.classList.remove('arch','cult');\n  badge.classList.add(type);\n  document.getElementById('d-badge-tx').textContent = isArch ? 'ARQUITECTURA' : 'CULTURA LOCAL';\n  document.getElementById('d-num').textContent = item.code;\n  document.getElementById('d-city').textContent = item.city.toUpperCase();\n  document.getElementById('d-name').textContent = item.name;\n\n  const sub = document.getElementById('d-subline');\n  if(isArch){\n    sub.innerHTML = `<span>${item.architect}<\u002Fspan><span class=\"yr\">${item.year}<\u002Fspan>`;\n  } else {\n    sub.innerHTML = `<span>${item.category}<\u002Fspan>`;\n  }\n\n  // Image placeholder (geometric)\n  const ref = document.getElementById('d-ref');\n  ref.classList.toggle('cult', !isArch);\n  const gx = document.getElementById('d-gx');\n  gx.innerHTML = `<svg viewBox=\"-14 -14 28 28\">${ICONS[item.icon]||''}<\u002Fsvg>`;\n  // recolor glyph for cult\n  gx.querySelectorAll('.glyph').forEach(el=>el.setAttribute('stroke', isArch?'var(--rgb-r)':'var(--rgb-c)'));\n  gx.querySelectorAll('.glyph-fill').forEach(el=>el.setAttribute('fill', isArch?'var(--rgb-r)':'var(--rgb-c)'));\n\n  const imgLink = document.getElementById('d-img-link');\n  if(item.imgUrl){ imgLink.href = item.imgUrl; imgLink.style.display=''; }\n  else { imgLink.style.display='none'; }\n\n  // Description\n  document.getElementById('d-desc').textContent = item.desc;\n\n  // Info table\n  const info = document.getElementById('d-info');\n  const rows = [];\n  rows.push(['DIRECCIÓN', `${item.address}<small>${item.lat.toFixed(5)}° N · ${Math.abs(item.lng).toFixed(5)}° W<\u002Fsmall>`]);\n  if(isArch){\n    rows.push(['AUTORÍA', item.architect]);\n    rows.push(['AÑO', String(item.year)]);\n    if(item.award) rows.push(['RECONOCIMIENTO', item.award]);\n  } else {\n    rows.push(['CATEGORÍA', item.category]);\n  }\n  info.innerHTML = rows.map(([l,v])=>`\n    <div class=\"info-row\"><div class=\"lb\">${l}<\u002Fdiv><div class=\"vl\">${v}<\u002Fdiv><\u002Fdiv>\n  `).join('');\n\n  // Access\n  const access = document.getElementById('d-access');\n  const gMaps  = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;\n  const gDir   = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;\n  const aMaps  = `https://maps.apple.com/?q=${encodeURIComponent(item.name)}&ll=${item.lat},${item.lng}`;\n  const osm    = `https://www.openstreetmap.org/?mlat=${item.lat}&mlon=${item.lng}#map=17/${item.lat}/${item.lng}`;\n  access.innerHTML = `\n    <a class=\"acc-link\" href=\"${gDir}\" target=\"_blank\" rel=\"noopener\">\n      <b>Cómo llegar<\u002Fb><span>Google Maps · ruta<\u002Fspan>\n    <\u002Fa>\n    <a class=\"acc-link\" href=\"${gMaps}\" target=\"_blank\" rel=\"noopener\">\n      <b>Ubicación<\u002Fb><span>Google Maps · pin<\u002Fspan>\n    <\u002Fa>\n    <a class=\"acc-link\" href=\"${aMaps}\" target=\"_blank\" rel=\"noopener\">\n      <b>Apple Maps<\u002Fb><span>iOS · macOS<\u002Fspan>\n    <\u002Fa>\n    <a class=\"acc-link\" href=\"${osm}\" target=\"_blank\" rel=\"noopener\">\n      <b>OpenStreetMap<\u002Fb><span>Cartografía abierta<\u002Fspan>\n    <\u002Fa>\n  `;\n\n  document.getElementById('panel-body').scrollTop = 0;\n}\n\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape') deselect(); });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
